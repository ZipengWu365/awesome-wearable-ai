<style>
  :root { color-scheme:light; --ink:#26344b; --muted:#6c788b; --line:#e6ebf3; --page:#f5f7fb; }
  * { box-sizing:border-box; }
  [hidden] { display:none!important; }
  body { margin:0; color:var(--ink); background:var(--page); font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  button,input,select { font:inherit; color:inherit; }
  button,a,input,select { -webkit-tap-highlight-color:transparent; }
  button { cursor:pointer; }
  a { color:inherit; text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid #6672e8; outline-offset:3px; }
  .atlas { height:100dvh; min-height:620px; max-width:1800px; margin:auto; padding:0 24px; display:grid; grid-template-rows:76px 48px minmax(0,1fr) 34px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .brand { display:flex; align-items:baseline; gap:16px; }
  h1 { font-size:26px; font-weight:650; letter-spacing:-1px; margin:0; }
  h1 span { color:#6672e8; }
  .subtitle,.header-links { font-size:12px; color:var(--muted); }
  .header-links { display:flex; gap:16px; align-items:center; }
  .repo { color:var(--ink); background:#fff; border:1px solid #dde4ef; border-radius:7px; padding:7px 12px; }
  .toolbar { display:flex; gap:9px; align-items:flex-start; min-width:0; }
  .search { flex:1; max-width:350px; min-width:120px; position:relative; }
  .search span { position:absolute; left:12px; top:7px; color:#8590a1; font-size:18px; }
  input { width:100%; height:34px; padding:7px 10px 7px 35px; background:#fff; border:1px solid #dde4ef; border-radius:7px; font-size:12px; }
  select { max-width:220px; height:34px; border:1px solid #dde4ef; border-radius:7px; padding:5px 26px 5px 10px; background:#fff; font-size:12px; text-overflow:ellipsis; }
  .scope { display:flex; gap:3px; background:#e9edf4; padding:3px; border-radius:7px; }
  .scope button { height:28px; border:0; background:transparent; border-radius:5px; padding:3px 10px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .scope button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 3px #26344b10; }
  .reset { height:34px; border:0; background:none; padding:0 4px; font-size:12px; color:var(--muted); }
  .match-count { margin-left:auto; align-self:center; padding-bottom:12px; font-size:11px; color:var(--muted); white-space:nowrap; }
  .workbench { position:relative; display:flex; min-height:0; gap:12px; }
  .canvas { flex:1; min-width:0; position:relative; overflow:hidden; background:#fff; border:1px solid #e0e6f0; border-radius:14px; }
  #graph { position:absolute; inset:0; }
  #paths { position:absolute; inset:0; width:100%; height:100%; }
  #nodes { position:absolute; inset:0; }
  .branch { position:absolute; top:17px; height:45px; border:0; background:none; text-align:center; font-size:13px; font-weight:600; color:var(--series); padding:0 3px; line-height:1.3; }
  .branch small { display:block; color:var(--muted); font-size:10px; font-weight:400; margin-top:5px; }
  .bucket { position:absolute; height:24px; min-width:34px; border:1px solid color-mix(in srgb,var(--series) 24%,white); border-radius:20px; color:var(--series); background:color-mix(in srgb,var(--series) 9%,white); padding:1px 10px; font-size:11px; font-weight:600; box-shadow:0 0 0 4px white; }
  .bucket:hover,.bucket[aria-pressed="true"] { color:#fff; background:var(--series); border-color:var(--series); }
  .empty { position:absolute; top:45%; left:0; width:100%; text-align:center; color:var(--muted); font-size:13px; pointer-events:none; }
  .panel { flex:0 0 380px; min-width:0; background:#fff; border:1px solid #e0e6f0; border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
  .panel-head { padding:18px 18px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .panel-head h2 { font-size:16px; margin:0 0 4px; font-weight:600; }
  .panel-head p { font-size:11px; color:var(--muted); margin:0; }
  .icon-button { border:0; background:#f1f4f9; border-radius:5px; height:27px; padding:2px 9px; font-size:14px; }
  .panel-body { min-height:0; overflow:auto; overscroll-behavior:contain; }

  .result:hover { background:#f7f9fd; }
  .result .meta { font-size:10px; color:var(--muted); display:flex; gap:8px; align-items:center; margin-bottom:5px; }
  .dot { width:6px; height:6px; border-radius:50%; display:inline-block; background:var(--series); flex:none; }
  .result .title { font-size:13px; font-weight:550; line-height:1.55; display:block; overflow-wrap:anywhere; }
  .result .family { display:block; font-size:10px; color:var(--muted); margin-top:6px; }
  .detail { padding:17px 18px 24px; }
  .back { border:0; background:none; padding:0; color:var(--muted); font-size:12px; margin-bottom:19px; }
  .detail h3 { font-size:19px; letter-spacing:-.3px; line-height:1.4; margin:0 0 12px; font-weight:600; overflow-wrap:anywhere; }
  .detail .byline { font-size:11px; color:var(--muted); margin:0 0 13px; }
  .tags { display:flex; gap:5px; flex-wrap:wrap; margin:12px 0 18px; }
  .tag { border-radius:4px; background:#f0f3f8; color:#63728a; font-size:10px; padding:3px 6px; }
  .source-link { display:inline-block; color:#3979df; border-bottom:1px solid #c8d7f1; margin:0 12px 10px 0; font-size:12px; padding-bottom:3px; }
  .detail section { margin-top:20px; }
  .detail section h4 { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:600; margin:0 0 6px; }
  .detail section p { font-size:12px; line-height:1.7; margin:0; overflow-wrap:anywhere; }
  .warning { border-left:3px solid #d4824d; background:#fff7ef; padding:10px 12px; font-size:11px; line-height:1.65; margin:8px 0 16px; }
  details { margin-top:24px; font-size:11px; color:var(--muted); }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:10px; line-height:1.6; color:#556479; }
  footer { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:10px; color:#7a8595; }

    .subtitle { display:none; }
    select { max-width:185px; }
    .match-count { display:none; }

  @media(max-width:760px) {
    .atlas { padding:0 12px; grid-template-rows:65px 124px minmax(0,1fr) 45px; min-height:720px; }
    h1 { font-size:23px; }
    .edition { display:none; }
    .toolbar { display:grid; grid-template-columns:minmax(0,1fr) 120px; grid-template-rows:34px 34px 34px; gap:7px; }
    .search { grid-column:1/-1; max-width:none; }
    .scope { width:max-content; }
    #family { max-width:none; width:100%; }
    #track { display:block; width:120px; }
    .reset { justify-self:end; }
    .scope button { padding:3px 7px; font-size:11px; }
    .panel { width:100%; box-shadow:none; }
    footer { font-size:9px; align-items:flex-start; padding-top:9px; }
    footer span:first-child { max-width:57%; }
    footer span:last-child { text-align:right; }
  }
  @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
</style>

    const left=narrow?84:88,right=20,lane=(w-left-right)/active.length,top=88,bottom=h-102,rootY=h-37,rootX=(left+w-right)/2;
    const yy=bin=>bottom-(data.bins.indexOf(bin)/(data.bins.length-1))*(bottom-top);
    for(const bin of data.bins){const y=yy(bin);add('line',{x1:left-7,x2:w-right,y1:y,y2:y,stroke:'#edf1f7'});text(left-17,y+4,bin.label,10,'#8290a3','end');}
    text(left-17,25,'Year ↑',10,'#8290a3','end');
    active.forEach((branch,slot)=>{
      const center=left+(slot+.5)*lane,branchRows=rows.filter(r=>r.branch===branch.id),heading=element('button','branch',branch.label);heading.type='button';heading.style.cssText=`left:${center-lane/2}px;width:${lane}px;--series:${branch.color}`;heading.append(element('small','',`${branchRows.length} records`));heading.setAttribute('aria-label',`Open all ${branchRows.length} ${branch.label.toLowerCase()} records`);heading.onclick=()=>openList({branch:branch.id},heading);nodes.append(heading);
      add('path',{d:`M${rootX},${rootY-10} C${rootX},${rootY-38} ${center},${rootY-22} ${center},${bottom+22}`,fill:'none',stroke:branch.color,'stroke-width':1.8,opacity:.55});
      add('line',{x1:center,x2:center,y1:bottom+22,y2:top-15,stroke:branch.color,'stroke-width':1.5,opacity:.3});
      for(const bin of data.bins){const group=branchRows.filter(r=>r.bin===bin.id);if(!group.length)continue;const y=yy(bin),b=element('button','bucket',String(group.length));b.type='button';b.dataset.branch=branch.id;b.dataset.bin=bin.id;b.dataset.count=String(group.length);b.style.cssText=`left:${center-19}px;top:${y-12}px;--series:${branch.color}`;b.title=`${branch.label} · ${bin.label} · ${group.length} records`;b.setAttribute('aria-label',`Open ${group.length} ${branch.label.toLowerCase()} records from ${bin.label}`);const r=detail&&byId.get(detail);b.setAttribute('aria-pressed',String(Boolean(r?r.branch===branch.id&&r.bin===bin.id:selection&&selection.branch===branch.id&&selection.bin===bin.id)));b.onclick=()=>openList({branch:branch.id,bin:bin.id},b);nodes.append(b);b.style.left=`${center-b.offsetWidth/2}px`;}
    });
    add('rect',{x:rootX-61,y:rootY-13,width:122,height:27,rx:7,fill:'#344460'});text(rootX,rootY+4,scope==='watchlist'?'Watchlist':'Wearable AI',12,'#fff');
    text(rootX,h-8,narrow?'Choose a count to expand every record':'Choose a branch or year count to expand every record',10,'#8290a3');
    $('empty').hidden=rows.length>0;$('match-count').textContent=`${rows.length} / ${scoped().length} records`;
  }
  function updateFilters(){selection=null;detail=null;const first=filtered()[0];if(first)$('track').value=first.branch;panel.hidden=false;showList();render();history.replaceState(null,'',location.pathname+location.search);}
  function changeScope(value){scope=value;selection=null;detail=null;panel.hidden=true;history.replaceState(null,'',location.pathname+location.search);$('accepted-scope').setAttribute('aria-pressed',String(value==='accepted'));$('watchlist-scope').setAttribute('aria-pressed',String(value==='watchlist'));fillFamilies();fillTracks();render();if($('query').value.trim())openList(null);}
  $('coverage-label').textContent=`${data.counts.accepted} / ${data.counts.accepted} records mapped`;
  $('accepted-scope').textContent=`Registry ${data.counts.accepted}`;$('watchlist-scope').textContent=`Watchlist ${data.counts.watchlist}`;
  $('cutoff').textContent=`${data.counts.accepted} accepted + ${data.counts.watchlist} candidates · Cutoff ${data.cutoff}`;
  $('query').addEventListener('input',updateFilters);$('family').addEventListener('change',updateFilters);$('track').addEventListener('change',()=>{selection=null;detail=null;panel.hidden=true;render();});
  $('accepted-scope').onclick=()=>changeScope('accepted');$('watchlist-scope').onclick=()=>changeScope('watchlist');$('close-panel').onclick=closePanel;
  $('reset').onclick=()=>{$('query').value='';$('family').value='';changeScope('accepted');history.replaceState(null,'',location.pathname+location.search);};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)closePanel();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('query').focus();}});
  fillFamilies();fillTracks();new ResizeObserver(render).observe(graph);render();
  const initial=byId.get(decodeURIComponent(location.hash.slice(1)));if(initial){changeScope(initial.catalog_status);selection={branch:initial.branch,bin:initial.bin};showDetail(initial);}
})();
</script>
