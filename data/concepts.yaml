counterfactual_layers:
  predictive-counterfactual: Changes to model inputs that alter predictions; does not identify treatment effects.
  causal-counterfactual: Potential outcomes under alternative interventions; requires identification assumptions
    or randomization.
  policy-counterfactual: Outcomes under alternative sequential decision policies; requires overlap and reliable
    policy evaluation.
  generative-counterfactual: Simulated trajectories or digital twins; requires calibration and interventional validation.
