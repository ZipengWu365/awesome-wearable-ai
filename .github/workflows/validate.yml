name: Validate evidence atlas

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make build
      - run: make test
      - run: make audit
      - run: node --test tests/engine.test.mjs
      - name: Ensure generated outputs are committed and deterministic
        run: |
          git diff --exit-code README.md generated/ site/ docs/RELEASE_AUDIT.md
          sha256sum README.md generated/registry.json generated/statistics.json site/index.html site/registry.json > /tmp/before.sha256
          make build
          sha256sum README.md generated/registry.json generated/statistics.json site/index.html site/registry.json > /tmp/after.sha256
          diff -u /tmp/before.sha256 /tmp/after.sha256

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_all.py
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-screenshots
          path: portal-*.png
